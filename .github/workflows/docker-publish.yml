# main 的 ci 全綠後，在 GitHub 的 arm64 runner 建 backend / frontend 映像推到 GHCR；
# Pi 端只 `docker compose pull && docker compose up -d`，不在本機 build。
# NEXT_PUBLIC_API_URL 是同源相對路徑，寫進公開映像不含主機資訊。
name: docker-publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  PYTHON_VERSION: "3.14"
  NEXT_PUBLIC_API_URL: /api/v1
  APP_ENV: development

jobs:
  publish:
    # 只接受本 repo main 的 push：fork PR 的分支也可能叫 main，不擋會把外部程式碼推進正式映像
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend/Dockerfile
          - name: frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker build -f ${{ matrix.dockerfile }} \
            --build-arg NODE_VERSION="$NODE_VERSION" \
            --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg APP_ENV="$APP_ENV" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$sha" \
            -t "$image:latest" -t "$image:sha-${sha::7}" .
          docker push "$image:latest"
          docker push "$image:sha-${sha::7}"
