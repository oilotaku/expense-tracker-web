name: iOS unsigned IPA
on:
  workflow_dispatch:
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app
  BUILDS_PATH: /tmp/action-builds

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Install iOS platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Generate project
        run: |
          brew install xcodegen
          sips -z 1024 1024 icon-source.png --out /tmp/icon-1024.png
          # App icons must be opaque; the PWA source has an alpha channel
          magick /tmp/icon-1024.png -background "#8257D6" -alpha remove -alpha off \
            ExpenseTracker/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination 'generic/platform=iOS' \
            -archivePath $BUILDS_PATH/ExpenseTracker.xcarchive \
            CODE_SIGN_IDENTITY= CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee $BUILDS_PATH-log.txt | grep -E "error:|warning: unreachable|\*\* ARCHIVE" || true
          test -d $BUILDS_PATH/ExpenseTracker.xcarchive/Products/Applications/ExpenseTracker.app
      - name: Show errors
        if: failure()
        run: grep -E "error:" $BUILDS_PATH-log.txt | sort -u | head -100 || true
      - name: Package IPA
        run: |
          mkdir -p $BUILDS_PATH/Payload
          mv $BUILDS_PATH/ExpenseTracker.xcarchive/Products/Applications/ExpenseTracker.app $BUILDS_PATH/Payload/
          cd $BUILDS_PATH && zip -qr ExpenseTracker.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-unsigned
          path: /tmp/action-builds/ExpenseTracker.ipa
          retention-days: 14
