name: ExpenseTracker
options:
  bundleIdPrefix: com.example.expensetracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.expensetracker.app
        PRODUCT_NAME: ExpenseTracker
        INFOPLIST_FILE: ExpenseTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
